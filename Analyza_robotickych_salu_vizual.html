            padding: 0;
        }
        .container {

        }

            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 20px;

        }
        h3 {
            font-size: 18px;
            font-weight: 500;
            margin: 10px 0;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
        }
        select {
            width: 100%;
            max-width: 400px;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            margin-bottom: 24px;
        }
        .timeline {
            margin-bottom: 40px;
        }
        .timeline-header {
            position: relative;
            width: 1000px;
            margin-bottom: 5px;
        }
        .timeline-mark {
            position: absolute;
            font-size: 12px;
            color: #666;
        }
        .timeline-mark::before {
            content: '';
            display: block;
            height: 8px;
            border-left: 1px solid #999;
        }
        .room-timeline {
            margin-bottom: 30px;
        }
        .timeline-container {
            position: relative;
            width: 1000px;
            height: 60px;
            background-color: #f5f5f5;
            border-radius: 6px;
        }
        .timeline-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: #ccc;
        }
        .operation {
            position: absolute;
            border-radius: 4px;
        }
        .patient-stay {
            height: 20px;
            top: 5px;
            background-color: #e0e0e0;
        }
        .operation-time {
            height: 20px;
            top: 5px;
            border: 1px solid rgba(0, 0, 0, 0.3);
            z-index: 1;
        }
        .operation-time span {
            font-size: 12px;
            font-weight: bold;
            padding: 0 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }
        .robot-time {
            height: 12px;
            top: 30px;
            background-color: #ff6666;
            border-radius: 4px;
        }
        .operation-GYN {
            background-color: #ff9ecf;
        }
        .operation-URO {
            background-color: #ffdb8e;
        }
        .operation-CHIR {
            background-color: #a8e6a8;
        }
        .operation-ORL {
            background-color: #d7a8e6;
        }
        .operations-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            overflow-x: auto;
        }
        .operations-table th,
        .operations-table td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }
        .operations-table th {
            background-color: #f1f1f1;
            font-weight: 600;
        }
        .operations-table tr:hover {
            background-color: #f9f9f9;
        }
        .legend {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }
        .legend-item {
            display: flex;
            align-items: center;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            display: inline-block;
            margin-right: 8px;
            border-radius: 2px;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            font-size: 18px;
        }
        .error {
            color: #dc3545;
            font-weight: 600;
        }

        // Funkce pro formátování času
        function formatTime(timeStr) {
            if (!timeStr) return '';
            return timeStr.padStart(5, '0');
        }

        // Funkce pro parsování času na minuty
        function parseTime(timeStr) {
            if (!timeStr) return null;
            const paddedTimeStr = timeStr.padStart(5, '0');
            const [hours, minutes] = paddedTimeStr.split(':').map(Number);
            return hours * 60 + minutes;
        }

        // Funkce pro formátování doby trvání
        function formatDuration(minutes) {
            if (minutes <= 0) return '';
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
        }

        // Funkce pro analýzu CSV dat
        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            const headers = lines[0].split(',');
            
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                const values = line.split(',');
                
                if (values.length === headers.length) {
                    const row = {};
                    headers.forEach((header, index) => {
                        row[header] = values[index];
                    });
                    data.push(row);
                }
            }
            
            return data;
        }

                // Analýza CSV dat
                const operations = parseCSV(operationsCSV);
                
                // Zpracování dat pro vizualizaci
                const processedOperations = operations.map(op => ({
                    ...op,
                    prijezdPacientaMinutes: parseTime(op['Příjezd pacienta']),
                    odjezdPacientaMinutes: parseTime(op['Odjezd pacienta']),
                    zacatekOperaceMinutes: parseTime(op['Začátek operace']),
                    konecOperaceMinutes: parseTime(op['Konec operace']),
                    robotZacatekMinutes: parseTime(op['Robot začátek']),
                    robotKonecMinutes: parseTime(op['Robot konec'])
                }));
                
                // Extrahujeme unikátní datumy
                const dates = [...new Set(processedOperations.map(op => op.Datum))].sort();
                
                // Naplníme select pro výběr datumu
                const dateSelect = document.getElementById('date-select');
                dates.forEach(date => {
                    const option = document.createElement('option');
                    option.value = date;
                    
                    // Najdeme den v týdnu pro toto datum
                    const dayOfWeek = operations.find(op => op.Datum === date)?.Den || '';
                    option.textContent = `${date} (${dayOfWeek})`;
                    
                    dateSelect.appendChild(option);
                });
                
                // Funkce pro aktualizaci vizualizace podle vybraného data
                function updateVisualization() {
                    const selectedDate = dateSelect.value;
                    
                    // Filtrujeme operace podle vybraného data
                    const filteredOperations = selectedDate
                        ? processedOperations.filter(op => op.Datum === selectedDate)
                        : [];
                    
                    // Aktualizujeme nadpis časové osy
                    const dayOfWeek = filteredOperations[0]?.Den || '';
                    document.getElementById('timeline-title').textContent = `Časová osa pro ${selectedDate} (${dayOfWeek})`;
                    
                    // Seskupíme operace podle sálů
                    const roomGroups = {};
                    filteredOperations.forEach(op => {
                        if (!roomGroups[op.Sál]) {
                            roomGroups[op.Sál] = [];
                        }
                        roomGroups[op.Sál].push(op);
                    });
                    
                    // Konstanty pro časovou osu
                    const startHour = 7; // 7:00
                    const endHour = 16; // 16:00 (15:30 + margin)
                    const totalMinutes = (endHour - startHour) * 60;
                    const timelineWidth = 1000; // px
                    
                    // Pomocná funkce pro převod minut na pozici v pixelech
                    function minutesToPosition(minutes) {
                        if (!minutes) return 0;
                        const minutesFromStart = minutes - (startHour * 60);
                        return (minutesFromStart / totalMinutes) * timelineWidth;
                    }
                    
                    // Vykreslení časových značek
                    const timelineHeader = document.getElementById('timeline-header');
                    timelineHeader.innerHTML = '';
                    
                    for (let i = 0; i <= (endHour - startHour) * 2; i++) {
                        const hour = Math.floor(i / 2) + startHour;
                        const minute = (i % 2) * 30;
                        const position = minutesToPosition(hour * 60 + minute);
                        
                        const timeMarker = document.createElement('div');
                        timeMarker.className = 'timeline-mark';
                        timeMarker.style.left = `${position}px`;
                        timeMarker.textContent = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
                        
                        timelineHeader.appendChild(timeMarker);
                    }
                    
                    // Vykreslení časových os pro jednotlivé sály
                    const roomTimelinesContainer = document.getElementById('room-timelines');
                    roomTimelinesContainer.innerHTML = '';
                    
                    Object.entries(roomGroups).forEach(([room, roomOperations]) => {
                        const roomSection = document.createElement('div');
                        roomSection.className = 'room-timeline';
                        
                        const roomTitle = document.createElement('h3');
                        roomTitle.textContent = room;
                        roomSection.appendChild(roomTitle);
                        
                        const timelineContainer = document.createElement('div');
                        timelineContainer.className = 'timeline-container';
                        
                        // Vykreslení operací
                        roomOperations.forEach(op => {
                            // Čas pobytu pacienta na sále
                            const patientStartPosition = minutesToPosition(op.prijezdPacientaMinutes);
                            const patientEndPosition = minutesToPosition(op.odjezdPacientaMinutes);
                            const patientWidth = patientEndPosition - patientStartPosition;
                            
                            if (patientWidth > 0) {
                                const patientStay = document.createElement('div');
                                patientStay.className = 'operation patient-stay';
                                patientStay.style.left = `${patientStartPosition}px`;
                                patientStay.style.width = `${patientWidth}px`;
                                patientStay.title = `Pacient: ${formatTime(op['Příjezd pacienta'])} - ${formatTime(op['Odjezd pacienta'])}`;
                                timelineContainer.appendChild(patientStay);
                            }
                            
                            // Čas samotné operace
                            const opStartPosition = minutesToPosition(op.zacatekOperaceMinutes);
                            const opEndPosition = minutesToPosition(op.konecOperaceMinutes);
                            const opWidth = opEndPosition - opStartPosition;
                            
                            if (opWidth > 0) {
                                const operationTime = document.createElement('div');
                                operationTime.className = `operation operation-time operation-${op.Odbornost}`;
                                operationTime.style.left = `${opStartPosition}px`;
                                operationTime.style.width = `${opWidth}px`;
                                operationTime.title = `${op.Odbornost}: ${formatTime(op['Začátek operace'])} - ${formatTime(op['Konec operace'])}`;
                                
                                const opLabel = document.createElement('span');
                                opLabel.textContent = op.Odbornost;
                                operationTime.appendChild(opLabel);
                                
                                timelineContainer.appendChild(operationTime);
                            }
                            
                            // Čas využití robota
                            const robotStartPosition = minutesToPosition(op.robotZacatekMinutes);
                            const robotEndPosition = minutesToPosition(op.robotKonecMinutes);
                            const robotWidth = robotEndPosition - robotStartPosition;
                            
                            if (robotWidth > 0) {
                                const robotTime = document.createElement('div');
                                robotTime.className = 'operation robot-time';
                                robotTime.style.left = `${robotStartPosition}px`;
                                robotTime.style.width = `${robotWidth}px`;
                                robotTime.title = `Robot: ${formatTime(op['Robot začátek'])} - ${formatTime(op['Robot konec'])}`;
                                timelineContainer.appendChild(robotTime);
                            }
                        });
                        
                        roomSection.appendChild(timelineContainer);
                        roomTimelinesContainer.appendChild(roomSection);
                    });
                    
                    // Naplníme tabulku operací
                    const tableBody = document.getElementById('operations-table-body');
                    tableBody.innerHTML = '';
                    
                    // Seřazení operací podle sálů a času začátku operace
                    const sortedOperations = [...filteredOperations].sort((a, b) => {
                        if (a.Sál !== b.Sál) return a.Sál.localeCompare(b.Sál);
                        return a.zacatekOperaceMinutes - b.zacatekOperaceMinutes;
                    });
                    
                    sortedOperations.forEach(op => {
                        const row = document.createElement('tr');
                        
                        // Buňky tabulky
                        const cells = [
                            { value: op.Sál },
                            { value: op.Odbornost },
                            { value: formatTime(op['Příjezd pacienta']) },
                            { value: formatTime(op['Začátek operace']) },
                            { value: formatTime(op['Konec operace']) },
                            { value: formatTime(op['Odjezd pacienta']) },
                            { value: formatTime(op['Robot začátek']) },
                            { value: formatTime(op['Robot konec']) },
                            { value: op['Pauza před op.'] }
                        ];
                        
                        cells.forEach(cell => {
                            const td = document.createElement('td');
                            td.textContent = cell.value || '';
                            row.appendChild(td);
                        });
                        
                        tableBody.appendChild(row);
                    });
                }
                
                // Přidáme posluchač událostí pro změnu vybraného data
                dateSelect.addEventListener('change', updateVisualization);
                
                // Inicializujeme vizualizaci s prvním datem
                if (dates.length > 0) {
                    dateSelect.value = dates[0];
                    updateVisualization();
                }
                
                // Zobrazíme obsah a skryjeme načítání
                loadingElement.style.display = 'none';
                contentElement.style.display = 'block';
                
            } catch (err) {
                console.error('Chyba při inicializaci aplikace:', err);
                loadingElement.style.display = 'none';
                errorElement.textContent = 'Chyba při načítání dat: ' + err.message;
                errorElement.style.display = 'block';
            }
        }

        // Inicializace aplikace po načtení stránky
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
